<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B0C1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D0610;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Gold border ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner subtle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.4" />

  <!-- Letter V -->
  <text
    x="10"
    y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="bold"
    fill="url(#goldGrad)"
    filter="url(#glow)"
    letter-spacing="1"
  >VK</text>

  <!-- Decorative diamond dot at bottom -->
  <polygon points="32,57 34,54 32,51 30,54" fill="#FFD700" opacity="0.85" />
</svg>